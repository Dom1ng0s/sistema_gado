# Config do yoyo-migrations para uso direto do CLI:
#   yoyo list          -- migrations e status
#   yoyo apply         -- aplica pendentes
#   yoyo rollback      -- desfaz a última
#   yoyo new -m "..."  -- cria uma migration nova
#
# init_db.py / conftest.py NÃO leem este arquivo — usam db_migrate.apply_migrations().
# A URL vem das mesmas vars de ambiente do app (.env: DB_USER, DB_PASSWORD, ...).
[DEFAULT]
sources = %(here)s/migrations
database = mysql://%(DB_USER)s:%(DB_PASSWORD)s@%(DB_HOST)s:%(DB_PORT)s/%(DB_NAME)s
batch_mode = on
verbosity = 1
